name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Core and calibration checks
        run: ./gradlew :vision-core:test :vision-core:verifyCalibration :vision-core:verifyMutations :vision-core:verifyRuntimeTemplates :vision-core:verifyCoreLogic :vision-core:verifyReplayInfrastructure
      - name: Build and lint
        run: ./gradlew :app:assembleProductionDebug :app:assembleOneTapIntegrationDebug :app:compileProductionDebugAndroidTestKotlin :app:lintProductionDebug :app:lintOneTapIntegrationDebug :app:verifyNoRawCalibrationAssets :app:verifyProductionIsolation :test-target:assembleDebug
